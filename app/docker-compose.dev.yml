# Explicit project name — the dev and prod compose files share this folder, so without distinct
# names they'd collide on the default project ("app") and a `down` on one could tear down another.
# (Learned the hard way.)
name: snapdini-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: snapdini-dev-app
    restart: unless-stopped
    # Dev: tsx watch auto-restarts the server on any src edit (src is bind-mounted below),
    # so backend changes need no rebuild and no manual `restart`.
    command: ["npm", "run", "dev"]
    volumes:
      - ./src:/app/src         # live-mounted for dev — restart container to pick up code changes
      - ./assets:/app/assets:ro # bundled assets (slideshow music) — read-only
      - ./data:/data           # local data (Postgres lives in the db service; keep this on fast disk)
      # The server reads its version from package.json (src/server/index.ts). src/ is mounted
      # but package.json was not, so dev reported whatever version was baked into the image
      # at build time and drifted further behind on every release. Read-only mount keeps the
      # reported version honest without a rebuild.
      - ./package.json:/app/package.json:ro
      # Heavy media (event photos/videos + theme images) lives here. Point UPLOADS_HOST at a
      # ZFS pool mounted over NFS to offload storage; leave it for the local default.
      # PERMISSIONS: the app runs as root in-container, so the host/NFS dir must be writable by
      # it — `chown -R 0:0 <dir>` (or match the container uid) and export the NFS share with
      # no_root_squash (or rw for that uid). Create the dir first: `mkdir -p <dir>`.
      - ${UPLOADS_HOST:-/bigdata/snapdini/dev}:${UPLOADS_DIR:-/data/uploads}
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BASE_URL=${BASE_URL:-http://localhost:3001}   # public URL for links/QR/emails — set per-deploy in .env
      - DATA_DIR=/data
      - UPLOADS_DIR=${UPLOADS_DIR:-/data/uploads}   # container path for media (host = UPLOADS_HOST)
      - DATABASE_URL=${DATABASE_URL:-postgres://snapdini:snapdini@db:5432/snapdini}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-64}
      - MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB:-8192}
      - IMAGE_QUALITY=${IMAGE_QUALITY:-100}
      - VIDEO_MAX_SECONDS=${VIDEO_MAX_SECONDS:-60}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Email via Mailgun HTTP API (alternative to SMTP; preferred when set).
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_BASE=${MAILGUN_BASE:-}
      # System address the contact form emails (e.g. support@snapdini.com).
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      # Bot check (Cloudflare Turnstile). Unset secret = feature entirely inert, so this is safe
      # to carry before keys exist. These MUST be listed here: the compose files pass env
      # explicitly rather than via env_file, so anything absent from this list never reaches the
      # container no matter what .env says.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_ALLOWED_HOSTNAMES=${TURNSTILE_ALLOWED_HOSTNAMES:-}
      - TURNSTILE_FAIL_OPEN=${TURNSTILE_FAIL_OPEN:-}
      - CONTACT_RATE_LIMIT=${CONTACT_RATE_LIMIT:-}
      - AUTH_RATE_LIMIT=${AUTH_RATE_LIMIT:-}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-}
      - EMAIL_RATE_LIMIT=${EMAIL_RATE_LIMIT:-}
      - GUEST_EMAIL_RATE_LIMIT=${GUEST_EMAIL_RATE_LIMIT:-5}
      - PHOTO_DELETE_WINDOW_SECONDS=${PHOTO_DELETE_WINDOW_SECONDS:-60}
      - PHOTO_DELETE_CONFIRM_GRACE_SECONDS=${PHOTO_DELETE_CONFIRM_GRACE_SECONDS:-15}
      - IMAGE_CONCURRENCY=${IMAGE_CONCURRENCY:-}
      - MUSIC_DIR=${MUSIC_DIR:-/app/assets/music}
      # ── First-party product analytics (site_events) ──
      # On by default and cookieless: nothing is stored on a visitor's device, and visits are
      # grouped by a hash that rotates daily. Set ANALYTICS_SALT to a fixed secret only if you want
      # visit grouping to survive a restart within the same day; leaving it unset is more private.
      - ANALYTICS_SALT=${ANALYTICS_SALT:-}
      - ANALYTICS_FLUSH_MS=${ANALYTICS_FLUSH_MS:-5000}
      - ANALYTICS_MAX_BUFFER=${ANALYTICS_MAX_BUFFER:-5000}
      - ANALYTICS_RATE_LIMIT=${ANALYTICS_RATE_LIMIT:-240}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
      - MACHINE_LEARNING_URL=${MACHINE_LEARNING_URL:-}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.42}
      - FACE_MIN_SCORE=${FACE_MIN_SCORE:-0.7}
      - FACE_TIMEOUT_MS=${FACE_TIMEOUT_MS:-20000}
      # Enrolment is judged separately from gallery matching: one cooperative face filling the
      # frame is an easier problem than a candid face in a crowd, and judging it at the crowd
      # threshold rejects perfectly good selfies.
      - FACE_SELFIE_MIN_SCORE=${FACE_SELFIE_MIN_SCORE:-0.5}
      - GUEST_SHOT_PACK=${GUEST_SHOT_PACK:-12}
      - GUEST_SHOT_PACK_CENTS=${GUEST_SHOT_PACK_CENTS:-300}
      - GUEST_UPGRADE_CUTOFF_MINUTES=${GUEST_UPGRADE_CUTOFF_MINUTES:-15}
      - VIDEO_GRACE_SECONDS=${VIDEO_GRACE_SECONDS:-0}
      - VIDEO_HARD_MAX_SECONDS=${VIDEO_HARD_MAX_SECONDS:-600}
      - GUEST_EMAIL_IP_LIMIT=${GUEST_EMAIL_IP_LIMIT:-200}
      - COUNTER_FLUSH_MS=${COUNTER_FLUSH_MS:-}
      # Present in the prod compose file but previously absent here, which meant the lifecycle
      # emails and operator notifications could not be exercised on the dev stack AT ALL — setting
      # them in .env did nothing, because compose passes env explicitly.
      - LIFECYCLE_EMAILS=${LIFECYCLE_EMAILS:-}
      - OPS_NOTIFICATIONS=${OPS_NOTIFICATIONS:-}
      - OPS_DIGEST_HOUR=${OPS_DIGEST_HOUR:-8}
      - OPS_ERROR_SPIKE=${OPS_ERROR_SPIKE:-20}
      - OPS_TZ=${OPS_TZ:-Australia/Brisbane}
      - DEMO_RATE_LIMIT=${DEMO_RATE_LIMIT:-15}
      - HOST_REWARD_PERCENT=${HOST_REWARD_PERCENT:-20}
      - HOST_REWARD_DAYS=${HOST_REWARD_DAYS:-90}
      # Site admin bootstrap (both unset = no admin, no shipped default credential).
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Google sign-in (optional; both unset = Google button hidden).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - BILLING_CURRENCY=${BILLING_CURRENCY:-usd}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Node is always present in the image (wget isn't); 200 from /api/config = healthy.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/config',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: snapdini-dev-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # adapter-node uses ORIGIN to build absolute URLs (og:image, og:url) behind the proxy.
      - ORIGIN=${BASE_URL:-http://localhost:3001}
      # Server-side link-preview fetches hit Express directly inside the Docker network.
      - INTERNAL_API_BASE=http://app:3000
      # Optional Google tag (Ads/Analytics). Empty = no tag, zero third-party tracking. Set your own
      # id in the stack's .env to enable it (Consent Mode v2 + EEA banner ship with it).
      - GTAG_ID=${GTAG_ID:-}
      # Google Ads conversion labels (the part after the "/" in each conversion's send_to).
      - GADS_PURCHASE_LABEL=${GADS_PURCHASE_LABEL:-}
      - GADS_SIGNUP_LABEL=${GADS_SIGNUP_LABEL:-}
      - GADS_CREATE_LABEL=${GADS_CREATE_LABEL:-}
      # Comma-separated emails whose signed-in sessions never fire conversions (site admins are always
      # excluded). Keeps the operator's own testing out of the ad data. Needs INTERNAL_API_BASE (set).
      - ANALYTICS_EXCLUDE_EMAILS=${ANALYTICS_EXCLUDE_EMAILS:-}
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: snapdini-dev-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=snapdini
      - POSTGRES_PASSWORD=snapdini
      - POSTGRES_DB=snapdini
    volumes:
      # Bind-mounted host folder so the DB is a plain directory you can copy/back up.
      # For other self-deploys that prefer a managed Docker volume, swap this for a
      # named volume (e.g. `pgdata:/var/lib/postgresql/data`) and declare it below.
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapdini"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: snapdini-dev-nginx
    restart: unless-stopped
    ports:
      - "3001:80"              # reverse proxy (Traefik) routes the dev domain (see BASE_URL) → this host:3001
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - web


networks:
  default:
    name: snapdini-dev-net
