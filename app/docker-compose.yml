# Snapdini — run from the PUBLISHED images (no build step). This is the default way to self-host and
# how production runs: it pulls the prebuilt app + web images and runs them with Postgres + nginx.
# To build from source instead, use docker-compose.dev.yml.
#
#   1. cp .env.example .env     # then fill in BASE_URL + POSTGRES_PASSWORD (+ Stripe/Mailgun/admin)
#   2. docker compose pull
#   3. docker compose up -d
#
# Pin a version with IMAGE_TAG (default `latest`); point at another registry with IMAGE_PREFIX.
# Put your TLS / reverse proxy in front of HTTP_PORT (default 8080). Upgrades = bump IMAGE_TAG, pull, up.
name: snapdini

# Log retention. The Docker default is an UNBOUNDED json-file, which on a disk already at 83%
# is a real outage risk. These caps keep a deep history for tracing (app/nginx ~250MB each,
# roughly weeks at current volume) while making it impossible to fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"


services:
  app:
    image: ${IMAGE_PREFIX:-ghcr.io/paytah232/snapdini}-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./data:/data
      - ${UPLOADS_HOST:-./data/uploads}:${UPLOADS_DIR:-/data/uploads}
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=${BASE_URL:?set BASE_URL to your public https URL}
      - DATA_DIR=/data
      - UPLOADS_DIR=${UPLOADS_DIR:-/data/uploads}
      - DATABASE_URL=${DATABASE_URL:-postgres://snapdini:${POSTGRES_PASSWORD:-snapdini}@db:5432/snapdini}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-64}
      - MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB:-8192}
      - IMAGE_QUALITY=${IMAGE_QUALITY:-100}
      - VIDEO_MAX_SECONDS=${VIDEO_MAX_SECONDS:-0}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      # Set to false ONLY for a relay you control whose certificate cannot be fixed — see UPGRADING.md.
      - SMTP_TLS_REJECT_UNAUTHORIZED=${SMTP_TLS_REJECT_UNAUTHORIZED:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_BASE=${MAILGUN_BASE:-}
      # Mailgun webhook signing key — NOT the API key. It is a separate secret (Mailgun calls it
      # the HTTP webhook signing key) that verifies the delivery events POSTed to
      # /api/webhooks/mailgun. Unset = the webhook endpoint answers 404 and invites still send
      # perfectly well; their delivery state simply stays "sent", which the host UI says plainly.
      # Setting the API key here by mistake fails EVERY verification with no visible symptom
      # beyond delivery state never updating, so it is worth checking twice.
      - MAILGUN_WEBHOOK_SIGNING_KEY=${MAILGUN_WEBHOOK_SIGNING_KEY:-}
      # The monthly send allowance, and how close to it the daily ops digest starts warning.
      # Mailgun's free plan is 3000 messages a calendar month; a paid plan is not, which is why
      # this is a variable rather than a constant that would quietly lie about the headroom.
      # Reported only — nothing here ever blocks a send, because silently refusing a host's
      # invites is a worse outcome than an overage.
      - MAILGUN_MONTHLY_LIMIT=${MAILGUN_MONTHLY_LIMIT:-}
      - MAILGUN_BUDGET_WARN_PCT=${MAILGUN_BUDGET_WARN_PCT:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      # Bot check (Cloudflare Turnstile). Unset secret = feature entirely inert, so this is safe
      # to carry before keys exist. These MUST be listed here: the compose files pass env
      # explicitly rather than via env_file, so anything absent from this list never reaches the
      # container no matter what .env says.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_ALLOWED_HOSTNAMES=${TURNSTILE_ALLOWED_HOSTNAMES:-}
      - TURNSTILE_FAIL_OPEN=${TURNSTILE_FAIL_OPEN:-}
      - CONTACT_RATE_LIMIT=${CONTACT_RATE_LIMIT:-}
      - AUTH_RATE_LIMIT=${AUTH_RATE_LIMIT:-}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-}
      - CSP_REPORT_RATE_LIMIT=${CSP_REPORT_RATE_LIMIT:-}
      - READ_ONLY_POLL_MS=${READ_ONLY_POLL_MS:-}
      - EMAIL_RATE_LIMIT=${EMAIL_RATE_LIMIT:-}
      - IMPORT_RATE_LIMIT=${IMPORT_RATE_LIMIT:-}
      - RECOVERY_RATE_LIMIT=${RECOVERY_RATE_LIMIT:-}
      # Empty falls through to the CODE default (routes/photos.ts), which is the one place the
      # number is explained. A literal fallback here silently outranked it — the code said 30
      # and every stack ran 60, because compose had already answered.
      - PHOTO_DELETE_WINDOW_SECONDS=${PHOTO_DELETE_WINDOW_SECONDS:-}
      # Empty, so the CODE owns the default — see the note above.
      - COMMENT_RATE_LIMIT=${COMMENT_RATE_LIMIT:-}
      - VISITOR_RATE_LIMIT=${VISITOR_RATE_LIMIT:-}
      - PG_POOL_MAX=${PG_POOL_MAX:-}
      - PG_STATEMENT_TIMEOUT_MS=${PG_STATEMENT_TIMEOUT_MS:-}
      - PHOTO_DELETE_CONFIRM_GRACE_SECONDS=${PHOTO_DELETE_CONFIRM_GRACE_SECONDS:-15}
      # Thumbnail workers. Defaults to CPUs-1; lower it on a small VPS sharing a box.
      - IMAGE_CONCURRENCY=${IMAGE_CONCURRENCY:-}
      # Where slideshow music is read from. Override to mount your own tracks.
      - MUSIC_DIR=${MUSIC_DIR:-/app/assets/music}
      # ── First-party product analytics (site_events) ──
      # On by default and cookieless: nothing is stored on a visitor's device, and visits are
      # grouped by a hash that rotates daily. Set ANALYTICS_SALT to a fixed secret only if you want
      # visit grouping to survive a restart within the same day; leaving it unset is more private.
      - ANALYTICS_SALT=${ANALYTICS_SALT:-}
      - ANALYTICS_FLUSH_MS=${ANALYTICS_FLUSH_MS:-5000}
      - ANALYTICS_MAX_BUFFER=${ANALYTICS_MAX_BUFFER:-5000}
      - ANALYTICS_RATE_LIMIT=${ANALYTICS_RATE_LIMIT:-240}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
      - MACHINE_LEARNING_URL=${MACHINE_LEARNING_URL:-}
      # How long to keep retrying a database that is not answering yet at boot (transient errors
      # only — a schema fault still fails fast). Stops a DB restart leaving the app permanently
      # half-alive; see the comment above initWithRetry() in src/server/index.ts.
      - DB_INIT_MAX_WAIT_MS=${DB_INIT_MAX_WAIT_MS:-300000}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.42}
      - FACE_MIN_SCORE=${FACE_MIN_SCORE:-0.7}
      - FACE_TIMEOUT_MS=${FACE_TIMEOUT_MS:-20000}
      # Enrolment is judged separately from gallery matching: one cooperative face filling the
      # frame is an easier problem than a candid face in a crowd, and judging it at the crowd
      # threshold rejects perfectly good selfies.
      - FACE_SELFIE_MIN_SCORE=${FACE_SELFIE_MIN_SCORE:-0.5}
      # Face ENROLMENT is rate limited on its own (index.ts), because one enrol request costs
      # an ML round trip per photo in the event. Raise it only for a test run.
      - FACE_ENROL_RATE_LIMIT=${FACE_ENROL_RATE_LIMIT:-}
      # How alike a re-submitted selfie has to be to count as the same one, which is what lets
      # a repeat enrolment skip that whole-gallery backfill. Cosine on unit vectors.
      - FACE_REENROL_SAME_THRESHOLD=${FACE_REENROL_SAME_THRESHOLD:-0.98}
      - GUEST_SHOT_PACK=${GUEST_SHOT_PACK:-12}
      - GUEST_SHOT_PACK_CENTS=${GUEST_SHOT_PACK_CENTS:-300}
      - GUEST_UPGRADE_CUTOFF_MINUTES=${GUEST_UPGRADE_CUTOFF_MINUTES:-15}
      - VIDEO_GRACE_SECONDS=${VIDEO_GRACE_SECONDS:-0}
      - VIDEO_HARD_MAX_SECONDS=${VIDEO_HARD_MAX_SECONDS:-600}
      - COUNTER_FLUSH_MS=${COUNTER_FLUSH_MS:-}
      - DEMO_RATE_LIMIT=${DEMO_RATE_LIMIT:-15}
      - HOST_REWARD_PERCENT=${HOST_REWARD_PERCENT:-20}
      - HOST_REWARD_DAYS=${HOST_REWARD_DAYS:-90}
      # Customer lifecycle emails (welcome/nudge/check-in/survey) — off unless set to 1. Needs email configured.
      - LIFECYCLE_EMAILS=${LIFECYCLE_EMAILS:-}
      - ANALYTICS_EXCLUDE_EMAILS=${ANALYTICS_EXCLUDE_EMAILS:-}
      # Operator notifications to SUPPORT_EMAIL (daily digest + instant alerts) — off unless set to 1.
      - OPS_NOTIFICATIONS=${OPS_NOTIFICATIONS:-}
      - OPS_TZ=${OPS_TZ:-}                                   # e.g. Australia/Brisbane (digest/times); default is used if unset
      - OPS_DIGEST_HOUR=${OPS_DIGEST_HOUR:-}                 # local hour for the daily digest (default 8)
      - OPS_ERROR_SPIKE=${OPS_ERROR_SPIKE:-}                 # client-errors/hour that trigger a spike alert (default 20)
      # Site admin bootstrap (both unset = no admin, no shipped default credential).
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Google sign-in (optional; both unset = Google button hidden).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Billing (set STRIPE_* to switch on; blank = fully free).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - BILLING_CURRENCY=${BILLING_CURRENCY:-usd}
    depends_on:
      db:
        condition: service_healthy
        # Without this, recreating db leaves this service holding a connection pool
        # to a container that no longer exists - the same silent breakage documented
        # on nginx below. Compose restarts this whenever db is RECREATED.
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/config',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/paytah232/snapdini}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=3000
      # adapter-node uses ORIGIN to build absolute URLs (og:image, og:url) behind the proxy.
      - ORIGIN=${BASE_URL}
      # Server-side link-preview fetches hit Express directly inside the Docker network.
      - INTERNAL_API_BASE=http://app:3000
      # Optional Google tag (Ads/Analytics). Empty = no tag, zero third-party tracking. Set your own
      # id in .env to enable it (ships with Consent Mode v2 + an EEA/UK consent banner).
      - GTAG_ID=${GTAG_ID:-}
      # Google Ads conversion labels (the part after the "/" in each conversion's send_to).
      - GADS_PURCHASE_LABEL=${GADS_PURCHASE_LABEL:-}
      - GADS_SIGNUP_LABEL=${GADS_SIGNUP_LABEL:-}
      - GADS_CREATE_LABEL=${GADS_CREATE_LABEL:-}
      # --- Microsoft Advertising (UET) --- independent of the Google tag above: either, both or
      # neither. Unset ⇒ bat.js is never loaded. MSUET_ID is the numeric UET tag id; the *_EVENT vars
      # are the goal ACTION names configured in Microsoft Advertising (the UET equivalent of a
      # Google Ads conversion label).
      - MSUET_ID=${MSUET_ID:-}
      - MSADS_PURCHASE_EVENT=${MSADS_PURCHASE_EVENT:-}
      - MSADS_SIGNUP_EVENT=${MSADS_SIGNUP_EVENT:-}
      - MSADS_CREATE_EVENT=${MSADS_CREATE_EVENT:-}
      # Whether THIS deployment may be indexed by search engines. Unset ⇒ every page answers
      # noindex and no sitemap is served, so a staging or preview host suppresses itself instead of
      # competing with the real site for its own search results. Set it to 1 on exactly one host.
      - SEO_INDEXABLE=${SEO_INDEXABLE:-}
      # Comma-separated emails whose signed-in sessions never fire conversions (site admins are always
      # excluded) — keeps the operator's own testing out of the ad data.
      - ANALYTICS_EXCLUDE_EMAILS=${ANALYTICS_EXCLUDE_EMAILS:-}
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    # Postgres ran entirely on its own defaults, which are sized for a small shared machine and not
    # for this one (19GB of RAM, and the database is the only thing on it that wants memory in bulk).
    # Every value here is deliberate:
    #
    #   shared_buffers        2GB   — ~10% of RAM. Conservative on purpose: the app, web and nginx
    #                                 share this box, and Postgres also leans on the OS page cache.
    #   effective_cache_size  8GB   — an ESTIMATE, not an allocation. It tells the planner how much
    #                                 is likely cached, which is what makes it choose an index scan
    #                                 over a sequential one. Costs nothing to raise.
    #   work_mem             16MB   — PER SORT NODE PER CONNECTION, so it multiplies: this is the one
    #                                 that hurts if you are greedy. 16MB against a pool capped at 20
    #                                 is a worst case well inside the budget, and it stops a large
    #                                 gallery's sort (~2.8MB at 14,000 photos, growing) from spilling
    #                                 to disk at the stock 4MB.
    #   maintenance_work_mem 512MB  — only for VACUUM / CREATE INDEX / REINDEX, one at a time.
    #   random_page_cost      1.1   — the default of 4 assumes a spinning disk seeking. Storage here
    #                                 is SSD-backed, so a random read costs almost what a sequential
    #                                 one does, and 4 talks the planner out of index scans it should
    #                                 be taking.
    #   max_connections       100   — unchanged, and comfortably above the app's pool of 20.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
    restart: unless-stopped
    # Published on LOOPBACK ONLY - unreachable from the LAN or the internet.
    # Stable endpoint for the DR standby's SSH-tunnelled streaming replication
    # (laundroprox). Binding a port rather than targeting the container IP means
    # the endpoint survives `compose up -d db` recreating the container.
    ports:
      - "127.0.0.1:5432:5432"
    logging: *default-logging
    environment:
      - POSTGRES_USER=snapdini
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapdini}
      - POSTGRES_DB=snapdini
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapdini"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    # Each proxied request costs 2 fds (client + upstream). The image ships a 1024 soft
    # limit against a 524288 hard limit, which caps real concurrency far below the box.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx resolves `app` and `web` ONCE, at startup, because they live in an upstream{} block —
    # and that block is not optional: without its keepalive pool nginx opens a new connection per
    # request and exhausts the ephemeral port range in ~34s at 840rps (see nginx/default.conf).
    #
    # So the DNS cache cannot be made dynamic without losing the pool. Instead, `restart: true`
    # makes Compose restart nginx whenever app or web is RECREATED, which is the only moment their
    # container IPs change. Without this, a plain `compose up -d app` leaves nginx proxying to an
    # address that now belongs to a different container — /api/ quietly returns the wrong service's
    # 404 and nothing looks broken.
    depends_on:
      app:
        condition: service_started
        restart: true
      web:
        condition: service_started
        restart: true
