# ── HTTPS for the DEV stack, under the production hostname ──────────────────────
#
# Why this exists: snapdini.com terminates TLS at Cloudflare, and both nginx stacks on this box
# speak plain HTTP behind it. To photograph the dev build on a phone with the real name in the URL
# bar, a LAN-only DNS record sends snapdini.com straight here — which means the certificate has to
# be presented HERE, by us, or the browser shows a warning and the shot is worthless.
#
# The certificate is a genuine Let's Encrypt one, issued by DNS-01 (so it needed no inbound traffic
# and nothing about the public routing changed). Only clients whose DNS points at this box ever
# reach it; everyone else still goes Cloudflare → Traefik → prod.
#
# DEV ONLY. It is mounted by docker-compose.dev.yml and by nothing else — the prod compose file
# mounts default.conf alone, so this file cannot reach the production container.
server {
    listen 443 ssl;
    http2 on;
    server_name snapdini.com;

    ssl_certificate     /etc/letsencrypt/live/snapdini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snapdini.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:4m;

    # Matches default.conf. An upload refused at 1MB by the TLS front while the HTTP one accepts 8GB
    # would be a difference nobody would think to look for.
    client_max_body_size 8192m;

    # Straight through to this container's own HTTP server rather than a second copy of its rules.
    # default.conf carries the API cache, the keepalive upstreams and the whole route table; a
    # duplicate would drift from it the first time either changed, and the drift would only show up
    # on the one path used for photography.
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app builds absolute URLs from this. Without it every link it writes comes back http://
        # and the phone downgrades out of the very padlock this file exists to produce.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # The join route sets a session cookie, and its response headers do not fit nginx's default
        # 4k proxy buffer. The single-hop HTTP server never sees this because it IS the origin; this
        # file adds a SECOND hop, so the headers have to survive being proxied once more. Without
        # these, /demo → /join/<code> answered 200 on the inside and 502 on the outside.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
