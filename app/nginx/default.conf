# Snapdini reverse proxy.
#
# Upstream connection pooling: WITHOUT an `upstream {}` block carrying `keepalive`, nginx opens a
# brand-new TCP connection to the backend for every single request and holds each one in
# TIME_WAIT for 60s. Under sustained load that burns the whole ephemeral port range
# (net.ipv4.ip_local_port_range, ~28k ports) in about 34 seconds at ~840 rps, after which every
# request 502s until the table drains. Setting `Connection ""` (empty, NOT "keep-alive") is the
# half that actually enables the pool.
# Access-log format for tracing. Adds the real client IP, total request time, upstream connect/
# header/response times, upstream status and the cache/keepalive picture — none of which the
# default 'combined' format carries. Without upstream timings you cannot tell a slow backend
# from a slow client.
log_format snapdini '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                    'urt=$upstream_response_time us=$upstream_status ua=$upstream_addr '
                    'host=$host xff="$http_x_forwarded_for"';

upstream web_backend {
    server web:3000;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream app_backend {
    server app:3000;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    # Set at the ORIGIN so a self-hosted deployment gets them too. On snapdini.com Cloudflare
    # already sends HSTS, X-Frame-Options and X-Content-Type-Options; identical values duplicated
    # are harmless, but if you change HSTS here, align or disable Cloudflare's so two policies with
    # different max-age cannot disagree.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # No camera/mic/geolocation for anything WE embed. The app's own camera is same-origin, which
    # `self` still permits — this only shuts the door on third-party frames.
    add_header Permissions-Policy        "geolocation=(), microphone=(), payment=(), camera=(self)" always;
    # Origin isolation. Stripe Checkout is a full-page redirect, not a popup, so same-origin does
    # not break payment; if a popup-based flow is ever added this needs revisiting.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP in REPORT-ONLY, deliberately. The page carries inline scripts (the consent defaults must
    # run before the tag loads, and SvelteKit inlines its hydration bootstrap), so an enforcing
    # policy without nonces would break the site on the first deploy. Run this, read the reports,
    # then tighten to enforcement.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com https://pagead2.googlesyndication.com https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://www.google-analytics.com https://region1.google-analytics.com https://cloudflareinsights.com https://googleads.g.doubleclick.net; frame-src https://www.googletagmanager.com https://challenges.cloudflare.com" always;

    access_log /var/log/nginx/access.log snapdini;

    # ── Real client IP ──────────────────────────────────────────────────────────
    # Behind Cloudflare -> Traefik -> here. Traefik must also trust Cloudflare
    # (forwardedHeaders.trustedIPs on its https entrypoint) or the visitor IP is already
    # gone by the time it reaches us. Without this the app (trust proxy 1) resolves req.ip
    # to the proxy for EVERY visitor, which silently makes every express-rate-limit bucket
    # site-wide (login 15/15m and checkout 20/15m shared by the whole internet).
    # Refresh: curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Generous headroom for large media — plans for 90s 8K clips (multi-GB). Per-file caps are
    # enforced app-side (MAX_VIDEO_SIZE_MB); this just stops nginx 413-ing before the app sees it.
    # Cloudflare caps request bodies and 413s oversized ones at the edge before nginx sees them.
    # MEASURED 2026-08-30 against snapdini.com: 101MB passes, 250MB refused (~200MB ceiling).
    # NOT a constraint in practice: the client uploads in 5MB chunks (web Camera.svelte CHUNK_SIZE),
    # so no single request approaches it. This limit only has to cover the single-shot path.
    client_max_body_size 8192m;

    # API + uploaded media are served by the Express backend.
    location /api/ {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Stream big uploads straight to the app rather than buffering the whole body to nginx
        # first (avoids a full second copy on disk), and allow time for slow large transfers.
        proxy_request_buffering off;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # Static marketing assets. SvelteKit already sends a 1-year immutable header for its own
    # content-hashed bundles, but /sample/ and the icons are plain files with no header at all —
    # which meant a CDN in front applied its own short default (4 hours, in our case) and the hero
    # was re-fetched all day.
    #
    # 30 days rather than a year, deliberately: these filenames are NOT content-hashed, and the
    # README invites a self-hoster to drop their own photos in at static/sample/. `immutable` would
    # make that change invisible for a year.
    location ~* ^/(sample|icons)/ {
        proxy_pass         http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=2592000" always;
    }

    location /uploads/ {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else is the SvelteKit (adapter-node) frontend.
    location / {
        proxy_pass         http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
