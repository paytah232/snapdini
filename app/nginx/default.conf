# Snapdini reverse proxy.
#
# Upstream connection pooling: WITHOUT an `upstream {}` block carrying `keepalive`, nginx opens a
# brand-new TCP connection to the backend for every single request and holds each one in
# TIME_WAIT for 60s. Under sustained load that burns the whole ephemeral port range
# (net.ipv4.ip_local_port_range, ~28k ports) in about 34 seconds at ~840 rps, after which every
# request 502s until the table drains. Setting `Connection ""` (empty, NOT "keep-alive") is the
# half that actually enables the pool.
# Access-log format for tracing. Adds the real client IP, total request time, upstream connect/
# header/response times, upstream status and the cache/keepalive picture — none of which the
# default 'combined' format carries. Without upstream timings you cannot tell a slow backend
# from a slow client.
log_format snapdini '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                    'urt=$upstream_response_time us=$upstream_status ua=$upstream_addr '
                    'host=$host xff="$http_x_forwarded_for"';

upstream web_backend {
    server web:3000;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream app_backend {
    server app:3000;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# ── An origin cache for the one response that is identical for everybody ───────────────────────
#
# The revealed gallery read is the highest fan-out response in the product: one host shares one link
# and four hundred phones ask for it at once, each getting a body that grows with the event (measured
# 530 bytes per photo — ~7.4MB uncompressed at 14,000). The app already does the hard part: that
# branch is built with NO viewer, so the bytes are byte-identical for every requester, and it sends
# `Cache-Control: public, max-age=30` with a correct `Vary`. Until now nothing but the browser
# honoured it, so N guests meant N full origin reads.
#
# `proxy_cache_valid` is deliberately absent: this cache obeys the ORIGIN's Cache-Control and nothing
# else. That matters more than it looks — every per-viewer reply the app sends is `private, no-store`
# (see perViewer()), so a response that must not be shared is never storable here by construction,
# rather than by a rule in this file agreeing with a rule in that one.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:16m max_size=512m
                 inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    # Set at the ORIGIN so a self-hosted deployment gets them too. On snapdini.com Cloudflare
    # already sends HSTS, X-Frame-Options and X-Content-Type-Options; identical values duplicated
    # are harmless, but if you change HSTS here, align or disable Cloudflare's so two policies with
    # different max-age cannot disagree.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # No geolocation or payment for anything, and no camera/mic for anything WE embed — `self` still
    # permits the app's own, so this only shuts the door on third-party frames.
    #
    # The microphone MUST be (self), not (). This read `microphone=()` from 2026-09-07 until it was
    # found, and `()` disables a feature for every origin INCLUDING our own: the browser refuses it
    # at the document level and never even offers a prompt. Video clips therefore recorded silently
    # for every guest, and no amount of granting permission could change it, because there was
    # nothing to grant. The camera was fine the whole time, which is exactly what made it look like
    # a microphone-permission problem on the device.
    add_header Permissions-Policy        "geolocation=(), microphone=(self), payment=(), camera=(self)" always;
    # Origin isolation. Stripe Checkout is a full-page redirect, not a popup, so same-origin does
    # not break payment; if a popup-based flow is ever added this needs revisiting.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP in REPORT-ONLY, deliberately. The page carries inline scripts (the consent defaults must
    # run before the tag loads, and SvelteKit inlines its hydration bootstrap), so an enforcing
    # policy without nonces would break the site on the first deploy. Run this, read the reports,
    # then tighten to enforcement.
    # A Report-Only policy that reports NOWHERE blocks nothing and collects nothing — it was a
    # header on every response buying zero. Both spellings: `report-uri` is deprecated but is what
    # Safari and older Chrome still use, `report-to` is the modern one and needs the
    # Reporting-Endpoints header above to resolve the name. Reports land on /api/csp-report, which
    # keeps the directive and the blocked ORIGIN and deliberately drops the URLs — they carry join
    # codes and recovery tokens. Promote this to an enforcing `Content-Security-Policy` once the
    # reports have been quiet on real traffic.
    add_header Reporting-Endpoints 'csp="/api/csp-report"' always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https://bat.bing.com; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://bat.bing.com https://www.googletagmanager.com https://static.cloudflareinsights.com https://pagead2.googlesyndication.com https://challenges.cloudflare.com; connect-src 'self' https://bat.bing.com https://challenges.cloudflare.com https://www.google-analytics.com https://region1.google-analytics.com https://cloudflareinsights.com https://googleads.g.doubleclick.net; frame-src https://www.googletagmanager.com https://challenges.cloudflare.com; report-uri /api/csp-report; report-to csp" always;

    access_log /var/log/nginx/access.log snapdini;

    # ── Compression ─────────────────────────────────────────────────────────────
    # There was none. nginx handed Cloudflare the gallery answer as plaintext JSON and Cloudflare
    # handed it on — the edge compresses what it caches, but a MISS (and every response was a miss
    # before the Cache-Control below) is proxied through untouched, and the byte that costs money
    # is the one leaving the house.
    #
    # MEASURED on the real endpoint (`GET /api/photos/<code>?gallery=true`, a 95-photo event):
    # 48,994 bytes plaintext, 7,546 gzipped at level 9 — 6.49x. The body is one repeated JSON shape
    # with long uuid paths in it, which is as compressible as text gets. On the owner's 100 Mbit
    # uplink, 150 guests crossing a reveal together is ~59 Mbit of JSON before this line and ~9
    # after it.
    #
    # level 5, not 9: measured on the same body, 9 is ~1% smaller for roughly twice the CPU. The
    # constraint here is the uplink, not the core.
    # min_length 1024 keeps it off the tiny answers (`{"revealed":false,"photoCount":3,…}` is ~90
    # bytes) where the gzip header alone is most of the payload.
    # proxied any — every request arrives via Traefik, so the default (`off` for proxied requests)
    # would have made the whole directive a no-op here.
    # vary on — the response now differs by Accept-Encoding, and the gallery answer below is
    # PUBLICLY cacheable. Without Vary a shared cache may hand a gzipped body to a client that did
    # not ask for one.
    gzip              on;
    gzip_types        application/json;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_vary         on;

    # ── Real client IP ──────────────────────────────────────────────────────────
    # Behind Cloudflare -> Traefik -> here. Traefik must also trust Cloudflare
    # (forwardedHeaders.trustedIPs on its https entrypoint) or the visitor IP is already
    # gone by the time it reaches us. Without this the app (trust proxy 1) resolves req.ip
    # to the proxy for EVERY visitor, which silently makes every express-rate-limit bucket
    # site-wide (login 15/15m and checkout 20/15m shared by the whole internet).
    # Refresh: curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Generous headroom for large media — plans for 90s 8K clips (multi-GB). Per-file caps are
    # enforced app-side (MAX_VIDEO_SIZE_MB); this just stops nginx 413-ing before the app sees it.
    # Cloudflare caps request bodies and 413s oversized ones at the edge before nginx sees them.
    # MEASURED 2026-08-30 against snapdini.com: 101MB passes, 250MB refused (~200MB ceiling).
    # NOT a constraint in practice: the client uploads in 5MB chunks (web Camera.svelte CHUNK_SIZE),
    # so no single request approaches it. This limit only has to cover the single-shot path.
    #
    # 256m, not the 8192m it was. The number was matched to MAX_VIDEO_SIZE_MB, which plans for
    # multi-GB 8K clips — but nothing sends one: Camera.svelte chunks anything over 5MB, and the
    # server's own chunk cap is 100MB, so the largest body the product produces is ~5MB. Cloudflare
    # refuses around 200MB regardless, which means the 8GB only ever applied to a request reaching
    # the origin DIRECTLY — exactly the request nobody legitimate makes, and the one that gets to
    # make nginx buffer eight gigabytes before the app has a chance to reject it.
    # Sized above Cloudflare's ceiling so CF stays the binding limit for real traffic, and 32x below
    # where it was for anything that goes around it. If direct single-shot uploads are ever wanted,
    # this is the line to raise, and the failure it gives first is a clear 413.
    client_max_body_size 256m;

    # How long a guest stares at a blank tab before the offline page below appears. The default is
    # 60s, and it is the connect step that runs long: when a container is stopped its address stops
    # being routable rather than refusing, so the SYNs are swallowed and nginx waits out the whole
    # timeout. MEASURED with the dev web container stopped: 22.7s to first byte.
    #
    # 5s, not lower: this only covers the TCP accept on a container one bridge hop away, which is
    # sub-millisecond when the backend is alive — the accept queue absorbs bursts long before this
    # fires. Deliberately only the CONNECT timeout; /api/ keeps its 3600s read/send timeouts, so
    # long uploads are untouched.
    proxy_connect_timeout 5s;

    # API + uploaded media are served by the Express backend.
    location /api/ {
        # proxy_intercept_errors stays OFF here on purpose: the app answers with its own JSON
        # error bodies and status codes, and swallowing those would hand an API client a branded
        # page instead of a machine-readable error. Only nginx-generated failures reach
        # @api_unavailable -- connect refused (502) and upstream timeout (504) -- and those are
        # exactly the "the app is not there" cases.
        error_page 502 503 504 @api_unavailable;

        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Origin cache ──
        # GET/HEAD only, and only what the app itself marked public — see the zone comment above.
        proxy_cache        api_cache;
        # The credentials are all headers, so they MUST be part of the key or one guest's reply
        # could be served to another. The app's own `Vary` covers the organizer code; this covers
        # the rest by construction, and the effect is that any request carrying a credential gets
        # its own key rather than sharing the anonymous one.
        proxy_cache_key    "$scheme$request_method$host$request_uri|$http_x_session_token|$http_x_visitor_token|$http_x_organizer_code";
        proxy_cache_methods GET HEAD;
        # One origin read for a thundering herd, and a stale copy while it happens, rather than 400
        # simultaneous misses when a reveal lands.
        proxy_cache_lock   on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # Stream big uploads straight to the app rather than buffering the whole body to nginx
        # first (avoids a full second copy on disk), and allow time for slow large transfers.
        proxy_request_buffering off;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # Static marketing assets. SvelteKit already sends a 1-year immutable header for its own
    # content-hashed bundles, but /sample/ and the icons are plain files with no header at all —
    # which meant a CDN in front applied its own short default (4 hours, in our case) and the hero
    # was re-fetched all day.
    #
    # 30 days rather than a year, deliberately: these filenames are NOT content-hashed, and the
    # README invites a self-hoster to drop their own photos in at static/sample/. `immutable` would
    # make that change invisible for a year.
    # `icons` used to be in this pattern as a DIRECTORY — /icons/ — and there has never been such
    # a directory: the only reference to it left in the repo was the comment below. So the block
    # matched nothing but 404s, while the icons it was written to cover sit at the ROOT and were
    # still being served on Cloudflare's 4-hour default. Measured on production before this change:
    # /sample/1-220.webp -> max-age=2592000, but /icon.svg, /favicon.ico and /favicon-32.png all
    # -> max-age=14400, which is the very default the comment says this exists to override.
    # Matched by filename now, because that is where the files actually are.
    #
    # /marketing/ joined the same rule for the same reason: the poster carousel, the gallery-reveal
    # still and the rest of the landing page's art arrived after this block was written and were
    # going out with NO cache header at all — so a CDN in front applied its own short default and
    # the landing page re-fetched its own artwork all day. They change about as often as the sample
    # photos do, which is to say almost never, and they get the same 30 days for the same reason
    # they do not get `immutable`: the names are not content-hashed.
    location ~* ^/(sample|marketing)/|^/(favicon\.ico|favicon-32\.png|icon\.svg|og\.png)$ {
        proxy_pass         http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # `expires`, NOT `add_header Cache-Control`, and that is the whole point of this line.
        #
        # nginx inherits the server-level add_header set into a location ONLY while that location
        # declares no add_header of its own. The moment one appears, the ENTIRE inherited set is
        # dropped — silently. From 2026-09-07 this block carried
        # `add_header Cache-Control "public, max-age=2592000" always;`, and so every response under
        # every response it matched went out with nothing but Cache-Control: no nosniff, no HSTS, no
        # X-Frame-Options, no Referrer-Policy, no Permissions-Policy, no COOP, no CSP. Measured, not
        # theorised — GET /sample/1.jpg returned exactly two headers.
        #
        # `expires` is a different directive, so it sets Cache-Control WITHOUT touching add_header
        # inheritance and the security headers above survive. It emits `max-age=2592000` rather than
        # `public, max-age=2592000`; for these responses that is equivalent, because a 200 with a
        # max-age and no cookie or Authorization is already shared-cacheable (RFC 9111 §3), which is
        # what Cloudflare acts on.
        #
        # If you ever need a header that only applies here, you must re-declare the full server-level
        # set in this block as well, or you will silently strip them again.
        expires            30d;
    }

    location /uploads/ {
        # Same reasoning as /api/: a dead app must not answer an <img> with a whole HTML document.
        error_page 502 503 504 @api_unavailable;

        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else is the SvelteKit (adapter-node) frontend.
    location / {
        # Intercept the frontend's OWN 5xx, not just nginx-generated ones. Without this, an upstream
        # that is up but answering 500/503 -- a SvelteKit SSR exception, or the node process
        # shutting down mid-deploy -- streams its raw error page straight to the guest, and the
        # branded offline page below never appears for the one failure mode a guest is most likely
        # to hit during a deploy.
        #
        # The trade-off is that a PERSISTENT SSR 500 now hides behind "we will be right back". It
        # is still in the app logs and in this server's access log as us=500, and the offline page
        # backs its polling off to one request per 15s, so it degrades quietly rather than looping.
        proxy_intercept_errors on;

        proxy_pass         http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Offline page ────────────────────────────────────────────────────────────
    # A branded, self-contained "we will be right back" page for every case where a backend cannot
    # answer: connect refused (502) while a container restarts or a deploy swaps it, upstream
    # timeout (504), and nginx's own 500/503. A guest mid-event otherwise gets the bare nginx
    # "502 Bad Gateway" wall, assumes the photos they just took are gone, and mashes refresh —
    # which is the worst possible traffic shape for a box that is already struggling.
    #
    # The page is INLINED in this config rather than living beside it as offline.html because the
    # nginx container mounts exactly one path — ./nginx/default.conf — in both docker-compose.yml
    # and docker-compose.dev.yml. A sibling file in this directory is simply not present inside the
    # container. Inline, the page ships wherever this config ships and cannot drift away from the
    # rules that serve it.
    #
    # Two things will bite you when editing the markup:
    #   * it is a single-quoted nginx string, so it must contain no ASCII apostrophe and no
    #     backslash. Use the typographic ’ (U+2019) instead — nginx does not treat it as a quote.
    #   * nginx interpolates $variables inside quoted strings, so the markup must contain no
    #     literal $ anywhere: no template literals in the script, no $ in the CSS.
    # `nginx -t` catches the first; the second fails silently by blanking part of the page.
    error_page 500 502 503 504 @offline;

    # Note there is no `=` in the error_page directives above, so the CLIENT still gets the original
    # 500/502/503/504 — the `return 503` below only supplies the body. That is deliberate: the
    # status code is what monitoring, Cloudflare and `curl -I` go on, and flattening a connect
    # refused and a 60s upstream timeout into one code throws away the only cheap signal for which
    # of the two happened. Adding `=` would force everything to 503; do not, unless you also stop
    # relying on us=... in the access log.
    #
    # There is deliberately no cache header, and no add_header of any kind. Declaring even one
    # would drop the ENTIRE inherited server-level security header set (see the long note in the
    # /sample/ block above) — VERIFIED on this response: HSTS, nosniff, X-Frame-Options,
    # Referrer-Policy, Permissions-Policy, COOP and the CSP all survive as it stands.
    #
    # It is also not needed. A 502/503/504 is not heuristically cacheable (RFC 9111 §4.2.2 lists
    # the codes that are, and no 5xx is among them), so neither the browser nor Cloudflare will
    # keep this page and show it after the site is back. `expires -1;` is NOT the workaround: its
    # filter ignores any status outside 200/201/204/206/3xx, so on a 502 it emits nothing at all —
    # it was in this block until a response dump showed no Cache-Control on the wire.
    location @offline {
        default_type text/html;
        # Why the page arrives in seven pieces: nginx reads its config through a fixed 4096-byte
        # buffer, so ANY single quoted parameter longer than that is rejected outright with
        # "too long parameter, probably missing terminating quote" -- which reads like a quoting
        # bug and is not one. The chunks are split at document seams (palette, layout, markup,
        # script) and each keeps ~1KB of headroom; if you add enough to overflow one, split it
        # again rather than trying to raise the limit, which is a compile-time constant.
        #
        # They are set HERE, inside the named location, and not at server level: rewrite-phase
        # directives at server level run on EVERY request, and rebuilding 11KB of string per
        # request at 850 rps to serve a page that is almost never needed is pure waste.
        set $offline_head '<!doctype html>
        <html lang="en">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Snapdini — back in a moment</title>
        <noscript><meta http-equiv="refresh" content="30"></noscript>
        <style>
        :root {
          --bg: #f1efe8;
          --surface: #fdfcf9;
          --text: #17150f;
          --muted: #5b5648;
          --line: #e3dfd2;
          --accent: #f5c518;
          --accent-ink: #1a1a1a;
          --dot: #9a7100;
          --shadow: rgba(23, 21, 15, 0.10);
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --text: #f3f0e7;
            --muted: #a8a296;
            --line: #2c2c2c;
            --accent: #f5c518;
            --accent-ink: #1a1a1a;
            --dot: #f5c518;
            --shadow: rgba(0, 0, 0, 0.45);
          }
        }';
        set $offline_css_base '
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
          margin: 0;
          padding: 24px 16px;
          background: var(--bg);
          color: var(--text);
          font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          -webkit-font-smoothing: antialiased;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .card {
          width: 100%;
          max-width: 30rem;
          background: var(--surface);
          border: 1px solid var(--line);
          border-radius: 18px;
          padding: 30px 28px 24px;
          box-shadow: 0 14px 34px var(--shadow);
        }
        .mark {
          width: 54px;
          height: 54px;
          border-radius: 16px;
          background: var(--accent);
          color: var(--accent-ink);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .brand {
          margin: 16px 0 0;
          font-size: 0.78rem;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--muted);
        }
        h1 {
          margin: 6px 0 14px;
          font-size: clamp(1.5rem, 1.15rem + 1.6vw, 1.95rem);
          line-height: 1.2;
          letter-spacing: -0.015em;
        }
        p { margin: 0 0 14px; color: var(--muted); }
        p.lead { color: var(--text); }
        .rule { height: 1px; background: var(--line); border: 0; margin: 22px 0 18px; }
        .status {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 0.92rem;
          color: var(--muted);
          min-height: 1.6em;
        }
        .dot {
          flex: none;
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: var(--dot);
          animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.3; transform: scale(0.8); }
          50%      { opacity: 1;   transform: scale(1); }
        }';
        set $offline_css_parts '
        .row {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          margin-top: 16px;
        }
        .btn {
          font: inherit;
          font-weight: 600;
          color: var(--accent-ink);
          background: var(--accent);
          border: 1px solid transparent;
          border-radius: 10px;
          padding: 9px 16px;
          cursor: pointer;
        }
        .btn:hover { filter: brightness(1.06); }
        .btn:focus-visible { outline: 3px solid var(--dot); outline-offset: 2px; }
        .foot { margin: 0; font-size: 0.85rem; }
        .foot a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; }
        @media (max-width: 420px) {
          .card { padding: 24px 20px 20px; border-radius: 14px; }
          .row { flex-direction: column; align-items: stretch; }
          .btn { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
          .dot { animation: none; opacity: 1; }
          * { transition: none !important; }
        }
        </style>';
        set $offline_markup '
        </head>
        <body>
        <main class="card">
          <div class="mark">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M4 7h3l1.4-2h7.2L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/>
              <circle cx="12" cy="13" r="3.6"/>
            </svg>
          </div>
          <p class="brand">Snapdini</p>
          <h1>We’ll be right back</h1>
          <p class="lead">Snapdini is catching its breath for a minute. Nothing has been lost — every photo and video already taken is stored safely, and your event is exactly where you left it.</p>
          <p>Keep this page open. It checks for us on its own and will take you straight back the moment we are up again.</p>
          <hr class="rule">
          <div class="status" role="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="offline-status">Checking for a connection…</span>
          </div>
          <div class="row">
            <button id="offline-retry" class="btn" type="button">Check now</button>
            <p class="foot">Still here in a few minutes? <a href="mailto:support@snapdini.com">support@snapdini.com</a></p>
          </div>
        </main>';
        set $offline_js_setup '
        <script>
        (function () {
          var statusEl = document.getElementById("offline-status");
          var btn = document.getElementById("offline-retry");

          function say(text) { if (statusEl) { statusEl.textContent = text; } }

          // No fetch at all (a very old in-app browser): fall back to a plain slow reload rather
          // than leaving the guest on a page that promises to come back and never does.
          if (!window.fetch || !window.Promise) {
            say("Retrying shortly…");
            setTimeout(function () { window.location.reload(); }, 30000);
            return;
          }

          var MIN = 3000;
          var MAX = 15000;
          // The backoff survives a reload, on purpose. If the poll says "healthy" but the reloaded
          // page errors again — an upstream that answers the probe while the route itself is
          // broken — a fresh page would restart at 3s and loop on the box forever. Carrying the
          // wait across reloads means that loop settles at one request per 15s instead.
          var KEY = "snapdini-offline-backoff";
          var wait = MIN;
          var nextAt = 0;
          var busy = false;
          var timer = null;
          var canAbort = (typeof AbortController === "function");

          try {
            var stored = parseInt(sessionStorage.getItem(KEY) || "", 10);
            if (stored >= MIN && stored <= MAX) { wait = stored; }
          } catch (e) { /* private mode: storage throws on access, not just on write */ }

          function remember(v) { try { sessionStorage.setItem(KEY, String(v)); } catch (e) {} }
          function forget() { try { sessionStorage.removeItem(KEY); } catch (e) {} }

          // HEAD, no-store and a unique query string: this page is served THROUGH Cloudflare, which
          // happily hands back a cached 200 for /favicon.ico and would report the site healthy for
          // the whole outage. The query string forces a miss; no-store keeps the browser out of it.
          function probe(path) {
            var opts = { method: "HEAD", cache: "no-store", credentials: "omit" };
            var kill = null;
            if (canAbort) {
              var ctrl = new AbortController();
              opts.signal = ctrl.signal;
              kill = setTimeout(function () { ctrl.abort(); }, 4000);
            }
            var sep = (path.indexOf("?") === -1) ? "?" : "&";
            return fetch(path + sep + "hc=" + Date.now(), opts).then(function (res) {
              if (kill) { clearTimeout(kill); }
              return res.ok;
            }).catch(function () {
              if (kill) { clearTimeout(kill); }
              return false;
            });
          }
';
        set $offline_js_poll '
          // Both upstreams, because either one being unreachable is enough to land a guest here:
          // /favicon.ico is a static file off the SvelteKit frontend and /api/config is the
          // cheapest thing Express answers. Reloading when only one is back just serves the same
          // error again.
          function check() {
            if (busy) { return; }
            // A backgrounded tab costs the recovering box nothing. Keep the timer alive so the
            // page still recovers on browsers that do not fire visibilitychange.
            if (document.hidden) { schedule(); return; }
            busy = true;
            say("Checking…");
            Promise.all([probe("/favicon.ico"), probe("/api/config")]).then(function (ok) {
              busy = false;
              if (ok[0] && ok[1]) {
                forget();
                say("Back online — reloading…");
                window.location.reload();
                return;
              }
              wait = Math.min(MAX, Math.round(wait * 1.6));
              remember(wait);
              schedule();
            });
          }
';
        set $offline_js_sched '
          // Jitter, because the realistic failure is 150 guests at one event losing the site in the
          // same second. Without it they all come back in the same second too, and the first thing
          // the recovered box sees is the spike that knocked it over.
          function schedule() {
            clearTimeout(timer);
            var delay = Math.round(wait * (0.8 + Math.random() * 0.4));
            nextAt = Date.now() + delay;
            timer = setTimeout(check, delay);
            tick();
          }

          function tick() {
            if (busy) { return; }
            var left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
            say(left > 0 ? "Checking again in " + left + "s…" : "Checking…");
          }

          document.addEventListener("visibilitychange", function () {
            // Only if the wait has already elapsed — otherwise flicking between tabs fires a probe
            // per switch.
            if (!document.hidden && Date.now() >= nextAt) { clearTimeout(timer); check(); }
          });

          if (btn) {
            btn.addEventListener("click", function () {
              clearTimeout(timer);
              wait = MIN;
              remember(MIN);
              check();
            });
          }

          setInterval(tick, 1000);
          // Deliberately not checking on load: the page only exists because a probe would have
          // failed a moment ago, and every stranded client would fire it at the same instant.
          schedule();
        })();
        </script>
        </body>
        </html>';
        return 503 "$offline_head$offline_css_base$offline_css_parts$offline_markup$offline_js_setup$offline_js_poll$offline_js_sched";
    }

    # /api/ and /uploads/ get a small JSON body instead of the HTML page: those callers are XHR and
    # <img>, and handing an image request a full HTML document just wastes the bytes.
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"Snapdini is temporarily unavailable. Please retry in a moment."}';
    }
}
